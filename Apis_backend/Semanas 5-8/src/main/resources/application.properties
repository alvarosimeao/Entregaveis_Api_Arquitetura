spring.application.name=api-alunos-semanas-5-8
spring.datasource.url=${BANCO_URL:jdbc:postgresql://localhost:5432/ceuma}
spring.datasource.username=${BANCO_USUARIO:postgres}
spring.datasource.password=${BANCO_SENHA:}
spring.jpa.hibernate.ddl-auto=${BANCO_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.port=${PORT:8080}
aluno.nome=${NOME_ALUNO:Aluno de demonstração}
aluno.ra=${RA_ALUNO:000000}
api.jwt.secret-base64=${JWT_SECRET_BASE64:}
springdoc.swagger-ui.path=/api-docs
