<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" role="img" aria-labelledby="title desc">
  <title id="title">C4 simplificado do e-commerce</title>
  <desc id="desc">Cliente chama gateway, que acessa catálogo e pedidos. Pedidos chama pagamentos e publica eventos. Cada domínio tem seus dados.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
  <style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2.4;rx:12}.svc{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2.4;rx:12}.data{fill:#ecfdf5;stroke:#047857;stroke-width:2.4;rx:12}.event{fill:#fef3c7;stroke:#b45309;stroke-width:2.4;rx:12}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.name{font:700 20px Arial,sans-serif;fill:#0f172a}.sub{font:16px Arial,sans-serif;fill:#475569}.edge{stroke:#334155;stroke-width:2.4;fill:none;marker-end:url(#a)}.label{font:15px Arial,sans-serif;fill:#334155}</style>
  <rect class="bg" width="1300" height="720"/><text class="title" x="48" y="58">E-commerce: componentes e limites de domínio</text>
  <path class="edge" d="M250 205 H370"/><path class="edge" d="M580 180 H680 V275"/><path class="edge" d="M580 220 H905 V275"/>
  <path class="edge" d="M770 375 V485"/><path class="edge" d="M995 375 V485"/>
  <path class="edge" d="M1085 325 H1150 V180"/><path class="edge" d="M995 375 H1120 V590"/>
  <path class="edge" d="M1120 620 H800"/>
  <text class="label" x="280" y="192">HTTPS</text><text class="label" x="600" y="166">consulta</text><text class="label" x="774" y="206">pedido</text>
  <g transform="translate(50 155)"><rect class="box" width="200" height="100"/><text class="name" x="18" y="44">Cliente web</text><text class="sub" x="18" y="75">compra</text></g>
  <g transform="translate(370 155)"><rect class="svc" width="210" height="100"/><text class="name" x="18" y="44">API Gateway</text><text class="sub" x="18" y="75">entrada</text></g>
  <g transform="translate(680 275)"><rect class="svc" width="180" height="100"/><text class="name" x="18" y="44">Catálogo</text><text class="sub" x="18" y="75">busca e preço</text></g>
  <g transform="translate(905 275)"><rect class="svc" width="180" height="100"/><text class="name" x="18" y="44">Pedidos</text><text class="sub" x="18" y="75">checkout</text></g>
  <g transform="translate(680 485)"><rect class="data" width="180" height="90"/><text class="name" x="18" y="42">Dados Catálogo</text><text class="sub" x="18" y="70">domínio próprio</text></g>
  <g transform="translate(905 485)"><rect class="data" width="180" height="90"/><text class="name" x="18" y="42">Dados Pedidos</text><text class="sub" x="18" y="70">domínio próprio</text></g>
  <g transform="translate(1100 130)"><rect class="svc" width="170" height="100"/><text class="name" x="14" y="44">Pagamentos</text><text class="sub" x="14" y="75">autorização</text></g>
  <g transform="translate(1040 590)"><rect class="event" width="160" height="80"/><text class="name" x="14" y="35">Eventos</text><text class="sub" x="14" y="61">PedidoConfirmado</text></g>
  <g transform="translate(680 590)"><rect class="box" width="120" height="80"/><text class="name" x="10" y="35">Avisos</text><text class="sub" x="10" y="61">assíncrono</text></g>
  <text class="sub" x="48" y="685">Diagrama C4 simplificado: serviços por domínio. Integrações entre domínios exigem observabilidade e idempotência.</text>
</svg>
